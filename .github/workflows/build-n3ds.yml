name: Build (Nintendo 3DS)

# Builds the AM2R 3DS program (tools/n3ds/build.sh). Every passing run except pull requests and claude/* branches
# (work in progress) is published as a GitHub release with am2r.cia, am2r.3dsx, the ELF (for symbolizing crashes) and a QR code for FBI's Remote
# Install: branch pushes as am2r-3ds-b<run number> (pre-releases except on main, so releases/latest is the
# newest main build), pushed tags and releases made on GitHub under their own tag.

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: n3ds-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-n3ds:
    name: Build (Nintendo 3DS, AM2R)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest
    permissions:
      contents: write
    defaults:
      run:
        # A container job's default shell is sh.
        shell: bash
    env:
      # makerom (CIA packaging) and bannertool (HOME Menu banner) aren't part of devkitPro: built from
      # 3DSGuy/Project_CTR and diasurgical/bannertool at these tags.
      MAKEROM_REF: makerom-v0.19.0
      BANNERTOOL_REF: "1.2.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit count is the CIA's title version (cmake/n3ds.cmake)

      - name: Get commit info
        id: commit-info
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Build makerom and bannertool
        run: |
          git clone --quiet --depth 1 --branch "$MAKEROM_REF" https://github.com/3DSGuy/Project_CTR.git /opt/project_ctr
          make -C /opt/project_ctr/makerom deps
          make -C /opt/project_ctr/makerom program
          git clone --quiet --depth 1 --branch "$BANNERTOOL_REF" --recursive https://github.com/diasurgical/bannertool.git /opt/bannertool
          make -C /opt/bannertool
          mkdir -p /opt/n3ds-tools
          cp /opt/project_ctr/makerom/bin/makerom /opt/bannertool/output/linux-x86_64/bannertool /opt/n3ds-tools/

      - name: Build
        run: |
          tools/n3ds/build.sh build \
            -DN3DS_TOOLS_DIR=/opt/n3ds-tools \
            "-DBUTTERSCOTCH_COMMIT_HASH=${{ steps.commit-info.outputs.hash }}" \
            "-DBUTTERSCOTCH_COMMIT_DATE=${{ steps.commit-info.outputs.date }}"
          mkdir -p out
          cp build/am2r.cia build/am2r.3dsx out/
          cp build/butterscotch.elf out/am2r.elf
          ls -la out

      - name: Build the SD card kit
        run: |
          # What tools/n3ds/sdkit/am2r-sd.sh downloads: the preprocessor (static: runs on any Linux / WSL), tex3ds,
          # the SD data revision and the 3DS control config.
          cmake -S tools/n3ds-preprocess -B build-preprocess -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-preprocess
          mkdir -p kit/bin kit/seed
          cp build-preprocess/n3ds-preprocess "$DEVKITPRO/tools/bin/tex3ds" kit/bin/
          cp tools/n3ds/sd_data_rev.txt kit/
          cp res/n3ds/am2r/sd/config.ini kit/seed/
          tar -czf out/am2r-sd-tools.tar.gz -C kit bin sd_data_rev.txt seed
          cp tools/n3ds/sdkit/am2r-sd.sh tools/n3ds/sdkit/am2r-sd.bat out/
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: am2r-3ds
          path: out/

      - name: Publish release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: main
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh qrencode

          hash="${{ steps.commit-info.outputs.hash }}"
          create_args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            title="AM2R for 3DS $tag"
            built="Built from $hash."
          else
            # A re-run keeps its run number, so it updates the same release.
            tag="am2r-3ds-b$GITHUB_RUN_NUMBER"
            title="AM2R for 3DS build $GITHUB_RUN_NUMBER ($GITHUB_REF_NAME, $hash)"
            built="Built from $hash on \`$GITHUB_REF_NAME\`."
            create_args+=(--target "$GITHUB_SHA")
            if [ "$GITHUB_REF_NAME" != "$RELEASE_BRANCH" ]; then
              create_args+=(--prerelease)
            fi
          fi

          base="https://github.com/$GH_REPO/releases/download/$tag"
          # FBI: Remote Install -> Scan QR Code reads a URL and installs the CIA it downloads.
          qrencode -s 8 -m 4 -o out/am2r-cia-qr.png "$base/am2r.cia"

          marker="<!-- n3ds-build -->"
          {
            echo "$marker"
            echo "## Install with FBI"
            echo
            echo "FBI → Remote Install → Scan QR Code:"
            echo
            echo "![QR code for am2r.cia]($base/am2r-cia-qr.png)"
            echo
            echo "Direct link: $base/am2r.cia"
            echo
            echo "## SD card"
            echo
            echo "The game's files go in \`sdmc:/3ds/am2r/\`, made from your AM2R 1.1 (or Community Updates) \`data.win\`:"
            echo "run **am2r-sd.bat** on Windows (it sets up WSL if needed) or **am2r-sd.sh** on Linux, pick the \`data.win\` and a"
            echo "folder, and copy the \`3ds\` folder it makes to the root of the SD card."
            echo "This build needs SD data revision $(cat tools/n3ds/sd_data_rev.txt) (\`sd_data_rev.txt\` on the card)."
            echo
            echo "$built"
          } > notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            # A release made on GitHub, or a re-run: keep its text, add the install section once.
            gh release view "$tag" --json body --jq .body > existing.md
            if ! grep -qF "$marker" existing.md; then
              { cat existing.md; echo; echo; cat notes.md; } > combined.md
              gh release edit "$tag" --notes-file combined.md
            fi
          else
            gh release create "$tag" --title "$title" --notes-file notes.md "${create_args[@]}"
          fi
          gh release upload "$tag" --clobber out/am2r.cia out/am2r.3dsx out/am2r.elf out/am2r-cia-qr.png \
            out/am2r-sd-tools.tar.gz out/am2r-sd.sh out/am2r-sd.bat
